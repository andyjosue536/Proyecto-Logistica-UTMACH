<style>
  :root{
    --ink:#071B26;
    --ink-2:#0E2E3F;
    --ink-3:#123C51;
    --paper:#D9E3DE;
    --paper-dim:#C7D3CD;
    --amber:#E2A63B;
    --amber-dim:#7A5A22;
    --teal:#2E9C93;
    --teal-dim:#184A46;
    --coral:#D1594A;
    --coral-dim:#5C2921;
    --text-light:#EAF1EE;
    --text-dark:#0E2429;
    --muted:#8FA7AF;
    --muted-dark:#5A7078;
    --border:#1C4557;
    --display: 'Oswald', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--body);
    background:var(--ink);
    color:var(--text-light);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink);}

  .app{display:flex;min-height:100vh;}

  /* ===================== SIDEBAR ===================== */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--ink-2),var(--ink) 85%);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 6px 20px 6px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:8px;
    flex-shrink:0;
    overflow:hidden;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text .t1{
    font-family:var(--display);
    font-size:15px;letter-spacing:.06em;
    color:var(--text-light);text-transform:uppercase;
    line-height:1.15;
  }
  .brand-text .t2{
    font-size:10.5px;color:var(--muted);letter-spacing:.08em;
    text-transform:uppercase;
  }

  nav.menu{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;
    border-radius:7px;
    color:var(--muted);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    border-left:3px solid transparent;
    transition:background .15s ease, color .15s ease;
    user-select:none;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--ink-3);color:var(--text-light);}
  .nav-item.active{
    background:var(--ink-3);
    color:var(--amber);
    border-left:3px solid var(--amber);
  }
  .nav-section-label{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted-dark);
    margin:14px 6px 4px 6px;
  }
  .nav-badge{
    margin-left:auto;
    font-family:var(--mono);
    font-size:10px;
    background:var(--coral);
    color:var(--text-light);
    padding:1px 6px;border-radius:10px;
    min-width:16px;text-align:center;
  }

  /* ===================== MAIN ===================== */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--ink-2),var(--ink));
    position:sticky;top:0;z-index:20;
    gap:12px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topbar-left h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hamburger{
    display:none;
    background:var(--ink-3);border:1px solid var(--border);
    color:var(--text-light);width:38px;height:38px;border-radius:7px;
    align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  }
  .hamburger svg{width:19px;height:19px;}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(3,12,17,.6);
    z-index:39;backdrop-filter:blur(1px);
  }
  .sidebar-overlay.show{display:block;}
  .topbar h1{
    font-family:var(--display);
    font-size:22px;letter-spacing:.02em;
    margin:0;color:var(--text-light);
    text-transform:uppercase;
  }
  .topbar p{margin:2px 0 0 0;color:var(--muted);font-size:12.5px;}
  .clock{
    font-family:var(--mono);font-size:12px;color:var(--teal);
    text-align:right;
  }
  .clock .d{color:var(--muted);font-size:10.5px;}

  .content{padding:28px 32px 60px 32px;flex:1;}

  /* cards / grid */
  .grid{display:grid;gap:18px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.3fr .95fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--ink-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px 20px;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .card:hover{box-shadow:0 6px 24px rgba(0,0,0,.28);}
  .card h2{
    font-family:var(--display);
    font-size:14px;letter-spacing:.05em;text-transform:uppercase;
    margin:0 0 14px 0;color:var(--text-light);
    display:flex;align-items:center;gap:8px;
  }
  .card h2 svg{width:16px;height:16px;color:var(--amber);}

  .stat-card{padding:16px 18px;border-left:3px solid var(--border);}
  .stat-card.amber{border-left-color:var(--amber);}
  .stat-card.teal{border-left-color:var(--teal);}
  .stat-card.coral{border-left-color:var(--coral);}
  .stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
  .stat-card .value{font-family:var(--display);font-size:30px;color:var(--text-light);margin-top:4px;}
  .stat-card .sub{font-size:11.5px;color:var(--muted-dark);margin-top:2px;}
  .stat-card.amber .value{color:var(--amber);}
  .stat-card.teal .value{color:var(--teal);}
  .stat-card.coral .value{color:var(--coral);}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);
    font-weight:600;
  }
  tbody td{
    padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);
    color:var(--text-light);font-family:var(--mono);font-size:12.5px;
  }
  tbody tr:hover{background:rgba(255,255,255,.02);}
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:2px 9px;border-radius:20px;font-size:11px;font-family:var(--body);font-weight:600;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pill.ok{background:rgba(46,156,147,.15);color:var(--teal);}
  .pill.warn{background:rgba(226,166,59,.15);color:var(--amber);}
  .pill.danger{background:rgba(209,89,74,.15);color:var(--coral);}
  .pill.muted{background:rgba(143,167,175,.12);color:var(--muted);}

  /* buttons */
  .btn{
    font-family:var(--body);font-weight:600;font-size:13px;
    background:var(--amber);color:var(--ink);
    border:none;border-radius:7px;padding:10px 18px;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:filter .15s ease;
  }
  .btn svg{width:16px;height:16px;}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.25);}
  .btn{transition:filter .15s ease, transform .15s ease, box-shadow .15s ease;}
  .btn.secondary{background:var(--ink-3);color:var(--text-light);border:1px solid var(--border);}
  .btn.teal{background:var(--teal);color:#04211E;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* forms */
  label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  input,select{
    width:100%;background:var(--ink);border:1px solid var(--border);
    color:var(--text-light);border-radius:6px;padding:9px 11px;font-size:13.5px;
    font-family:var(--mono);
  }
  input:focus,select:focus{outline:none;border-color:var(--amber);}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{font-size:11px;color:var(--muted-dark);margin-top:4px;}
  .error-text{
    font-size:12.5px;color:var(--coral);margin-top:8px;
    background:rgba(209,89,74,.12);border:1px solid var(--coral-dim);
    border-radius:6px;padding:9px 11px;font-weight:600;
  }

  /* log / bitacora */
  .log-panel{max-height:420px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:8px;padding-right:4px;}
  .log-entry{
    display:flex;gap:10px;padding:9px 10px;border-radius:7px;
    background:var(--ink);border-left:3px solid var(--muted-dark);
    font-size:12.5px;line-height:1.45;
  }
  .log-entry .time{font-family:var(--mono);color:var(--muted-dark);font-size:10.5px;white-space:nowrap;padding-top:1px;}
  .log-entry.info{border-color:var(--teal);}
  .log-entry.success{border-color:var(--teal);}
  .log-entry.warning{border-color:var(--amber);}
  .log-entry.danger{border-color:var(--coral);}
  .log-entry .msg b{color:var(--text-light);}
  .log-empty{color:var(--muted-dark);font-size:12.5px;padding:10px 2px;}

  /* map */
  .map-wrap{
    position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;
    border-radius:10px;
    background:radial-gradient(circle at 12% 18%, rgba(46,156,147,.10), transparent 55%),
               radial-gradient(circle at 85% 80%, rgba(226,166,59,.09), transparent 50%),
               var(--ink);
    border:1px solid var(--border);
  }
  .map-wrap svg{display:block;}
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);}
  .map-legend span{display:inline-flex;align-items:center;gap:6px;}
  .map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .empty-state{
    text-align:center;padding:30px 10px;color:var(--muted-dark);font-size:13px;
  }
  .empty-state svg{width:30px;height:30px;margin-bottom:8px;color:var(--muted-dark);}

  .toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--ink-3);border:1px solid var(--border);border-left:4px solid var(--teal);
    padding:12px 18px;border-radius:8px;font-size:13px;max-width:340px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:all .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.danger{border-left-color:var(--coral);}

  .stamp{
    font-family:var(--display);font-size:10px;letter-spacing:.1em;
    color:var(--muted-dark);border:1px solid var(--border);
    padding:3px 8px;border-radius:4px;transform:rotate(-2deg);
    display:inline-block;text-transform:uppercase;
  }

  .section-title{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  }
  .section-title h2{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0;}
  .section-title p{margin:2px 0 0 0;color:var(--muted);font-size:12.5px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:4px;}

  @media print{
    .sidebar,.topbar,.toast,.no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .card{box-shadow:none;border-color:#ccc;}
  }

  /* ===================== RESPONSIVE ===================== */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:640px;}

  @media (max-width:1024px){
    .sidebar{position:fixed;left:0;top:0;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.5);
      transform:translateX(-100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .hamburger{display:flex;}
    .main{width:100%;}
  }
  @media (max-width:860px){
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .content{padding:18px 16px 40px 16px;}
    .topbar{padding:14px 16px;}
    .clock{display:none;}
  }
  @media (max-width:560px){
    .grid-4{grid-template-columns:1fr;}
    .topbar h1{font-size:17px;}
    .topbar p{font-size:11px;}
    .card{padding:14px 14px;}
    .row2{grid-template-columns:1fr;}
    .stat-card .value{font-size:24px;}
    .btn{width:100%;justify-content:center;}
    .sidebar{width:82vw;max-width:290px;}
    .map-legend{gap:8px;font-size:10px;}
  }
</style>
</head>

<script>
/* =====================================================================
   DISTRIBUMACH - SISTEMA INTELIGENTE DE DISTRIBUCION
   Traduccion web (HTML/CSS/JS) del algoritmo original en Java/NetBeans.
   Toda la logica de negocio (funciones y subprocesos) se conserva:
   calculo de distancias, tiempo, combustible, asignacion de vehiculos,
   fraccionamiento de carga, prioridades, validaciones y estadisticas.
   ===================================================================== */

// ---------------------------------------------------------------------
// 1. ESTADO / DATOS BASE (equivalente a la seccion 1 y 2 del .java)
// ---------------------------------------------------------------------
const state = {
  products: [
    { codigo: 101, nombre: "Caja de Banano",   stock: 120, minimo: 20, peso: 18, entregado: 0 },
    { codigo: 102, nombre: "Saco de Café",     stock: 80,  minimo: 15, peso: 60, entregado: 0 },
    { codigo: 103, nombre: "Caja de Camarón",  stock: 200, minimo: 30, peso: 22, entregado: 0 },
    { codigo: 104, nombre: "Saco de Arroz",    stock: 15,  minimo: 25, peso: 50, entregado: 0 },
    { codigo: 105, nombre: "Caja de Cacao",    stock: 50,  minimo: 10, peso: 25, entregado: 0 },
  ],
  vehicles: [
    { codigo: "V-01", capacidad: 500, cargaActual: 0, estado: "Disponible",   sector: 1, entregas: 0 },
    { codigo: "V-02", capacidad: 800, cargaActual: 0, estado: "Disponible",   sector: 1, entregas: 0 },
    { codigo: "V-03", capacidad: 350, cargaActual: 0, estado: "Mantenimiento", sector: 1, entregas: 0 },
  ],
  sectors: [
    { id: 1, nombre: "Centro (Almacén)", x: 0, y: 0 },
    { id: 2, nombre: "Norte",            x: 2, y: 5 },
    { id: 3, nombre: "Sur",              x: 3, y: -4 },
    { id: 4, nombre: "Este",             x: 5, y: 2 },
    { id: 5, nombre: "Puerto Bolívar",   x: 7, y: -3 },
  ],
  // Lista dinámica de pedidos: sin límite fijo de capacidad (mejora sobre el
  // arreglo estático de 5 posiciones del programa original en Java).
  pedidos: [],
  log: [],
  distMatrix: {},
};

// ---------------------------------------------------------------------
// 1b. PERSISTENCIA LOCAL (localStorage) — sin backend ni base de datos.
//     Guarda el estado operativo en el propio navegador para que no se
//     pierda al recargar la página, y permite reiniciar a valores de fábrica.
// ---------------------------------------------------------------------
const ESTADO_INICIAL = JSON.parse(JSON.stringify({
  products: state.products, vehicles: state.vehicles, pedidos: state.pedidos,
}));
const STORAGE_KEY = "distribumach_estado_v1";

function guardarEstado() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      products: state.products, vehicles: state.vehicles, pedidos: state.pedidos, log: state.log,
    }));
  } catch (e) { /* almacenamiento no disponible: la sesión continúa solo en memoria */ }
}

function cargarEstado() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.products) state.products = data.products;
    if (data.vehicles) state.vehicles = data.vehicles;
    if (data.pedidos) state.pedidos = data.pedidos;
    if (data.log) state.log = data.log;
    return true;
  } catch (e) { return false; }
}

function reiniciarSistema() {
  state.products = JSON.parse(JSON.stringify(ESTADO_INICIAL.products));
  state.vehicles = JSON.parse(JSON.stringify(ESTADO_INICIAL.vehicles));
  state.pedidos = JSON.parse(JSON.stringify(ESTADO_INICIAL.pedidos));
  state.log = [];
  localStorage.removeItem(STORAGE_KEY);
  log("Sistema reiniciado a los valores de fábrica.", "info");
}

function calcularDistancia(x1, y1, x2, y2) {
  return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
}
function calcularTiempoEntrega(distancia, velocidad = 40) { return distancia / velocidad; }
function calcularCombustible(distancia, rendimiento = 8) { return distancia / rendimiento; }

function construirMatrizDistancias() {
  const m = {};
  state.sectors.forEach(a => {
    m[a.id] = {};
    state.sectors.forEach(b => { m[a.id][b.id] = calcularDistancia(a.x, a.y, b.x, b.y); });
  });
  state.distMatrix = m;
}
construirMatrizDistancias();
cargarEstado();

// ---------------------------------------------------------------------
// 2. FUNCIONES DE NEGOCIO (equivalentes 1:1 a las del .java)
// ---------------------------------------------------------------------

// Selecciona el vehiculo mas adecuado: Disponible + capacidad suficiente + menor distancia.
function asignarVehiculo(pesoPedido, sectorPedido) {
  let idx = 0, mejorDistancia = -1;
  state.vehicles.forEach((v, i) => {
    const k = i + 1;
    if (v.estado === "Disponible") {
      const capacidadLibre = v.capacidad - v.cargaActual;
      if (capacidadLibre >= pesoPedido) {
        const d = state.distMatrix[v.sector][sectorPedido];
        if (idx === 0 || d < mejorDistancia) { idx = k; mejorDistancia = d; }
      }
    }
  });
  return idx;
}

function obtenerCapacidadMaxima() {
  return Math.max(...state.vehicles.map(v => v.capacidad));
}

function calcularVehiculosNecesarios(pesoPedido, capacidadMaxima) {
  if (capacidadMaxima <= 0) return 0;
  let nec = 0, acumulado = 0;
  while (acumulado < pesoPedido) { nec++; acumulado += capacidadMaxima; }
  return nec;
}

// Subproceso: fracciona la carga entre todos los vehiculos disponibles con espacio libre.
function asignarCargaMultiple(pesoPedido) {
  let restante = pesoPedido, pesoAsignado = 0;
  const vehiculosUsados = [];
  state.vehicles.forEach(v => {
    if (restante > 0 && v.estado === "Disponible") {
      const capacidadLibre = v.capacidad - v.cargaActual;
      if (capacidadLibre > 0) {
        const usar = Math.min(capacidadLibre, restante);
        v.cargaActual += usar;
        pesoAsignado += usar;
        vehiculosUsados.push(v.codigo);
        v.estado = "En Ruta";
        restante -= usar;
      }
    }
  });
  return { pesoAsignado, vehiculosUsados: vehiculosUsados.join(" ") };
}

function actualizarInventario(codigoProducto, cantidad) {
  const p = state.products.find(p => p.codigo === codigoProducto);
  if (p) p.stock -= cantidad;
}

// ---------------------------------------------------------------------
// 3. BITACORA (reemplaza los System.out.println del programa original)
// ---------------------------------------------------------------------
function log(msg, type = "info") {
  const now = new Date();
  const time = now.toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  state.log.push({ msg, type, time });
}

// ---------------------------------------------------------------------
// 4. SUBPROCESOS PRINCIPALES (opciones 1-5 del menu original)
// ---------------------------------------------------------------------

function registrarPedido({ codigo, sector, prodCod, cantidad, prioridad }) {
  if (state.pedidos.some(p => p.codigo === codigo)) {
    return { ok: false, error: "Ya existe un pedido registrado con ese código." };
  }
  if (!Number.isInteger(codigo) || codigo <= 0) {
    return { ok: false, error: "Ingrese un código numérico válido para el pedido." };
  }
  if (sector < 1 || sector > state.sectors.length) {
    return { ok: false, error: "Sector de entrega inválido." };
  }
  if (!state.products.some(p => p.codigo === prodCod)) {
    return { ok: false, error: "Código de producto inexistente. Revise el inventario." };
  }
  if (!(cantidad > 0)) {
    return { ok: false, error: "La cantidad debe ser mayor a cero." };
  }
  if (prioridad !== 1 && prioridad !== 2) {
    return { ok: false, error: "Prioridad inválida. Use 1 (Urgente) o 2 (Normal)." };
  }

  state.pedidos.push({ codigo, sector, prodCod, cantidad, estado: "Pendiente", prioridad, distancia: 0, tiempo: 0 });
  log(`Pedido <b>#${codigo}</b> registrado con estado <b>PENDIENTE</b> (prioridad ${prioridad === 1 ? "URGENTE" : "NORMAL"}).`, "success");
  return { ok: true };
}

// Cancela un pedido que todavía no ha entrado en preparación.
function cancelarPedido(codigo) {
  const idx = state.pedidos.findIndex(p => p.codigo === codigo);
  if (idx === -1) return { ok: false, error: "Pedido no encontrado." };
  if (state.pedidos[idx].estado !== "Pendiente") {
    return { ok: false, error: "Solo se pueden cancelar pedidos en estado Pendiente." };
  }
  state.pedidos.splice(idx, 1);
  log(`Pedido <b>#${codigo}</b> cancelado por el usuario.`, "warning");
  return { ok: true };
}

// Alterna manualmente un vehículo entre Disponible y Mantenimiento.
function alternarMantenimiento(codigo) {
  const v = state.vehicles.find(v => v.codigo === codigo);
  if (!v) return { ok: false, error: "Vehículo no encontrado." };
  if (v.estado === "En Ruta") return { ok: false, error: "No se puede modificar un vehículo que está en ruta." };
  v.estado = v.estado === "Mantenimiento" ? "Disponible" : "Mantenimiento";
  log(`Vehículo <b>${v.codigo}</b> marcado manualmente como <b>${v.estado}</b>.`, "info");
  return { ok: true };
}

// Genera y descarga un CSV con el reporte de gestión actual.
function exportarReporteCSV() {
  const s = calcularEstadisticas();
  const rows = [
    ["Reporte de Gestión — DistribuMACH", new Date().toLocaleString("es-EC")],
    [],
    ["Métrica", "Valor"],
    ["Órdenes registradas", s.totalPedidos],
    ["Completadas", s.entregados],
    ["Pendientes / Retenidas", s.pendientes],
    ["Tasa de efectividad (%)", s.tasa.toFixed(1)],
    ["Distancia promedio por entrega (km)", s.entregadosCount ? s.distanciaProm.toFixed(2) : ""],
    ["Tiempo promedio de entrega (min)", s.entregadosCount ? s.tiempoProm.toFixed(1) : ""],
    [],
    ["Vehículo", "Estado", "Entregas realizadas"],
    ...state.vehicles.map(v => [v.codigo, v.estado, v.entregas]),
    [],
    ["Producto", "Stock actual", "Mínimo", "Entregado histórico"],
    ...state.products.map(p => [p.nombre, p.stock, p.minimo, p.entregado]),
  ];
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `reporte-distribumach-${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function planificarRutas() {
  log("— Iniciando enrutamiento automático e inteligente —", "info");
  let encontrado = false;

  // Sugerencia de agrupacion por sector
  state.pedidos.forEach((pi, i) => {
    if (pi.codigo !== 0 && pi.estado === "Pendiente") {
      const enMismoSector = state.pedidos.filter(pj => pj.estado === "Pendiente" && pj.sector === pi.sector).length;
      if (enMismoSector > 1) {
        const sName = state.sectors.find(s => s.id === pi.sector).nombre;
        log(`Sugerencia: agrupar los pedidos del sector <b>${sName}</b> en un mismo vehículo.`, "info");
      }
    }
  });

  // Primero Urgentes (1), luego Normales (2)
  for (let k = 1; k <= 2; k++) {
    const etiqueta = k === 1 ? "URGENTE" : "NORMAL";
    let hayDeEstaCola = state.pedidos.some(p => p.estado === "Pendiente" && p.prioridad === k);
    if (hayDeEstaCola) log(`===== Procesando cola de prioridad: ${etiqueta} =====`, "info");

    state.pedidos.forEach(pedido => {
      if (pedido.estado === "Pendiente" && pedido.prioridad === k) {
        encontrado = true;
        log(`Procesando pedido <b>#${pedido.codigo}</b> (Prioridad: ${etiqueta})`, "info");

        const prod = state.products.find(p => p.codigo === pedido.prodCod);
        const stockOk = prod && prod.stock >= pedido.cantidad;
        const pesoPedido = prod ? prod.peso * pedido.cantidad : 0;
        const sectorNombre = state.sectors.find(s => s.id === pedido.sector).nombre;

        if (stockOk) {
          const vehIdx = asignarVehiculo(pesoPedido, pedido.sector);
          if (vehIdx !== 0) {
            const v = state.vehicles[vehIdx - 1];
            pedido.estado = "En Preparación";
            v.estado = "En Ruta";
            v.cargaActual += pesoPedido;

            const distancia = state.distMatrix[v.sector][pedido.sector];
            const tiempo = calcularTiempoEntrega(distancia, 40);
            const combustible = calcularCombustible(distancia, 8);
            pedido.distancia = distancia; pedido.tiempo = tiempo;

            log(`<b>DECISIÓN:</b> Pedido #${pedido.codigo} asignado al vehículo <b>${v.codigo}</b>. Motivo: capacidad disponible (${pesoPedido.toFixed(1)} kg de ${v.capacidad} kg), sector ${sectorNombre} y menor distancia (${distancia.toFixed(2)} km). Tiempo estimado: ${(tiempo * 60).toFixed(1)} min · Combustible: ${combustible.toFixed(2)} gal.`, "success");
          } else {
            const capMax = obtenerCapacidadMaxima();
            const necesarios = calcularVehiculosNecesarios(pesoPedido, capMax);

            if (pedido.prioridad === 1) {
              const r = asignarCargaMultiple(pesoPedido);
              if (r.pesoAsignado >= pesoPedido) {
                pedido.estado = "En Preparación";
                const distancia = state.distMatrix[1][pedido.sector];
                const tiempo = calcularTiempoEntrega(distancia, 40);
                pedido.distancia = distancia; pedido.tiempo = tiempo;
                log(`<b>DECISIÓN (URGENTE-FRACCIONADO):</b> el pedido (${pesoPedido.toFixed(1)} kg) supera la capacidad del vehículo más grande (${capMax} kg, se necesitaban ~${necesarios}) y fue repartido entre: <b>${r.vehiculosUsados}</b>`, "warning");
              } else if (r.pesoAsignado > 0) {
                log(`<b>ALERTA (URGENTE):</b> solo se logró cubrir ${r.pesoAsignado.toFixed(1)} kg de ${pesoPedido.toFixed(1)} kg usando: ${r.vehiculosUsados}. Se necesitan ~${necesarios} vehículos de ${capMax} kg. Quedará primero en la fila para el próximo intento.`, "danger");
              } else {
                log(`<b>ALERTA (URGENTE):</b> no hay vehículos disponibles en este momento. Se necesitan ~${necesarios} vehículos de ${capMax} kg c/u.`, "danger");
              }
            } else {
              if (pesoPedido > capMax) {
                log(`<b>ALERTA (NORMAL):</b> este pedido (${pesoPedido.toFixed(1)} kg) supera la capacidad máxima individual de la flota (${capMax} kg). Se necesitarían ~${necesarios} vehículos; considere dividirlo o registrarlo como URGENTE.`, "warning");
              } else {
                log(`<b>ALERTA (NORMAL):</b> no hay vehículos disponibles (todos ocupados o en mantenimiento). El pedido queda en cola tras los pedidos Urgentes.`, "warning");
              }
            }
          }
        } else {
          log(`<b>ALERTA:</b> pedido #${pedido.codigo} — salida denegada por falta de stock suficiente.`, "danger");
        }
      }
    });
  }

  if (!encontrado) log("No existen pedidos en estado Pendiente.", "info");
}

function realizarEntregas() {
  log("— Iniciando simulación de despacho y entrega —", "info");
  let encontrado = false;

  state.pedidos.forEach(pedido => {
    if (pedido.estado === "En Preparación") {
      pedido.estado = "Entregado";
      encontrado = true;
      actualizarInventario(pedido.prodCod, pedido.cantidad);
      const prod = state.products.find(p => p.codigo === pedido.prodCod);
      if (prod) prod.entregado += pedido.cantidad;
      log(`<b>[ENTREGA EXITOSA]</b> El pedido #${pedido.codigo} ha sido entregado.`, "success");
    }
  });

  state.vehicles.forEach(v => {
    if (v.estado === "En Ruta") {
      v.estado = "Disponible";
      v.cargaActual = 0;
      v.entregas += 1;
    }
  });

  if (!encontrado) log("No hay despachos listos en preparación.", "info");
}

function calcularEstadisticas() {
  const registrados = state.pedidos.filter(p => p.codigo !== 0);
  const totalPedidos = registrados.length;
  const entregados = registrados.filter(p => p.estado === "Entregado").length;
  const pendientes = totalPedidos - entregados;
  const tasa = totalPedidos > 0 ? (entregados / totalPedidos) * 100 : 0;

  const entregadosArr = registrados.filter(p => p.estado === "Entregado");
  const sumaDistancia = entregadosArr.reduce((a, p) => a + p.distancia, 0);
  const sumaTiempo = entregadosArr.reduce((a, p) => a + p.tiempo, 0);
  const distanciaProm = entregadosArr.length ? sumaDistancia / entregadosArr.length : 0;
  const tiempoProm = entregadosArr.length ? (sumaTiempo / entregadosArr.length) * 60 : 0;

  const vehTop = [...state.vehicles].sort((a, b) => b.entregas - a.entregas)[0];
  const prodTop = [...state.products].sort((a, b) => b.entregado - a.entregado)[0];

  return {
    totalPedidos, entregados, pendientes, tasa,
    distanciaProm, tiempoProm, entregadosCount: entregadosArr.length,
    vehTop, prodTop,
  };
}

function generarReporte() {
  log("— Reporte de gestión generado —", "info");
}

function estadoPill(estado) {
  const map = {
    "Disponible": "ok", "En Ruta": "warn", "Mantenimiento": "danger",
    "Pendiente": "muted", "En Preparación": "warn", "Entregado": "ok", "Vacio": "muted",
  };
  return `<span class="pill ${map[estado] || "muted"}">${estado}</span>`;
}

function sectorMapSVG(highlightRoutes = true) {
  const xs = state.sectors.map(s => s.x), ys = state.sectors.map(s => s.y);
  const minX = Math.min(...xs) - 1.8, maxX = Math.max(...xs) + 1.8;
  const minY = Math.min(...ys) - 1.8, maxY = Math.max(...ys) + 1.8;
  const W = 620, H = 340, PAD = 34;
  const sx = x => PAD + ((x - minX) / (maxX - minX)) * (W - PAD * 2);
  const sy = y => H - PAD - ((y - minY) / (maxY - minY)) * (H - PAD * 2);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block;font-family:'IBM Plex Sans',sans-serif;">`;
  svg += `<defs>
    <filter id="glowAmber" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E2A63B"/></marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8FA7AF"/></marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E9C93"/></marker>
  </defs>`;

  // grid náutico: líneas finas de fondo + ejes principales
  for (let gx = Math.ceil(minX); gx <= Math.floor(maxX); gx++) {
    svg += `<line x1="${sx(gx)}" y1="${PAD}" x2="${sx(gx)}" y2="${H - PAD}" stroke="#123C51" stroke-width="1"/>`;
  }
  for (let gy = Math.ceil(minY); gy <= Math.floor(maxY); gy++) {
    svg += `<line x1="${PAD}" y1="${sy(gy)}" x2="${W - PAD}" y2="${sy(gy)}" stroke="#123C51" stroke-width="1"/>`;
  }
  svg += `<rect x="${PAD}" y="${PAD}" width="${W - PAD * 2}" height="${H - PAD * 2}" fill="none" stroke="#1C4557" stroke-width="1.4"/>`;
  svg += `<line x1="${PAD}" y1="${sy(0)}" x2="${W - PAD}" y2="${sy(0)}" stroke="#2E5C72" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  svg += `<line x1="${sx(0)}" y1="${PAD}" x2="${sx(0)}" y2="${H - PAD}" stroke="#2E5C72" stroke-width="1.4" stroke-dasharray="4 4"/>`;

  // route lines (pedidos con distancia calculada)
  if (highlightRoutes) {
    state.pedidos.forEach(p => {
      if (p.codigo !== 0 && (p.estado === "En Preparación" || p.estado === "Entregado") && p.distancia > 0) {
        const destino = state.sectors.find(s => s.id === p.sector);
        const entregado = p.estado === "Entregado";
        const color = entregado ? "#2E9C93" : (p.prioridad === 1 ? "#E2A63B" : "#8FA7AF");
        const marker = entregado ? "arrowTeal" : (p.prioridad === 1 ? "arrowAmber" : "arrowMuted");
        svg += `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(destino.x)}" y2="${sy(destino.y)}"
          stroke="${color}" stroke-width="2" stroke-dasharray="${entregado ? '0' : '6 5'}" opacity="0.9"
          marker-end="url(#${marker})"/>`;
      }
    });
  }

  // sector nodes
  state.sectors.forEach(s => {
    const isAlmacen = s.id === 1;
    const cx = sx(s.x), cy = sy(s.y);
    if (isAlmacen) {
      svg += `<circle cx="${cx}" cy="${cy}" r="15" fill="#E2A63B" opacity="0.14"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="10" fill="#E2A63B" stroke="#3A2B0F" stroke-width="2.2" filter="url(#glowAmber)"/>`;
    } else {
      svg += `<circle cx="${cx}" cy="${cy}" r="7" fill="#0E2E3F" stroke="#2E9C93" stroke-width="2.2"/>`;
    }
    const anchor = cx > W - 120 ? "end" : (cx < 90 ? "start" : "middle");
    const dx = anchor === "end" ? -14 : (anchor === "start" ? 14 : 0);
    const dy = isAlmacen ? -18 : -13;
    svg += `<text x="${cx + dx}" y="${cy + dy}" fill="#EAF1EE" font-size="12.5" font-weight="600" text-anchor="${anchor}">${s.nombre}</text>`;
    svg += `<text x="${cx + dx}" y="${cy + dy + 14}" fill="#7C93A0" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="${anchor}">(${s.x}, ${s.y}) km</text>`;
  });

  // vehicles jittered around their sector
  const bySector = {};
  state.vehicles.forEach((v) => {
    bySector[v.sector] = bySector[v.sector] || 0;
    const offsetIdx = bySector[v.sector]++;
    const s = state.sectors.find(sec => sec.id === v.sector);
    const angle = (offsetIdx * 2.35) + 0.6;
    const ox = sx(s.x) + Math.cos(angle) * 22;
    const oy = sy(s.y) + Math.sin(angle) * 22 + 20;
    const color = v.estado === "Disponible" ? "#2E9C93" : v.estado === "En Ruta" ? "#E2A63B" : "#D1594A";
    svg += `<g>
      <rect x="${ox - 15}" y="${oy - 9}" width="30" height="16" rx="4" fill="${color}" opacity="0.95"/>
      <rect x="${ox - 15}" y="${oy - 9}" width="30" height="16" rx="4" fill="none" stroke="#071B26" stroke-width="1"/>
      <text x="${ox}" y="${oy + 3}" fill="#071B26" font-size="9.5" font-weight="700" font-family="IBM Plex Mono, monospace" text-anchor="middle">${v.codigo}</text>
    </g>`;
  });

  svg += `</svg>`;
  return svg;
}

function renderLog(containerId) {
  if (!state.log.length) return `<div class="log-empty">Sin actividad registrada todavía. Ejecuta una acción para ver la bitácora aquí.</div>`;
  return `<div class="log-panel" id="${containerId}">` +
    [...state.log].reverse().map(e => `
      <div class="log-entry ${e.type}">
        <div class="time">${e.time}</div>
        <div class="msg">${e.msg}</div>
      </div>`).join("") +
    `</div>`;
}

const PAGES = {
  panel:      { title: "Panel General",       sub: "Estado en tiempo real de la operación de distribución", render: pagePanel },
  inventario: { title: "Inventario",          sub: "Consulta de stock y alertas de reposición",       render: pageInventario },
  pedidos:    { title: "Pedidos",             sub: "Registro y seguimiento de pedidos de clientes",   render: pagePedidos },
  rutas:      { title: "Planificar Rutas",    sub: "Enrutamiento automático e inteligente",            render: pageRutas },
  despachos:  { title: "Despachos",           sub: "Simulación de despacho y entrega operativa",       render: pageDespachos },
  reporte:    { title: "Reporte de Gestión",  sub: "Desempeño logístico y estadísticas",               render: pageReporte },
};
let currentPage = "panel";

function showToast(msg, type = "info") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type === "danger" ? " danger" : "");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = "toast"; }, 3200);
}

function updateBadges() {
  document.getElementById("badge-inventario").textContent = state.products.filter(p => p.stock <= p.minimo).length;
  document.getElementById("badge-pedidos").textContent = state.pedidos.filter(p => p.codigo !== 0 && p.estado === "Pendiente").length;
}

function render() {
  const page = PAGES[currentPage];
  document.getElementById("page-title").textContent = page.title;
  document.getElementById("page-sub").textContent = page.sub;
  document.getElementById("content").innerHTML = page.render();
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.page === currentPage));
  updateBadges();
  attachPageEvents();
  guardarEstado();
}

function attachPageEvents() {
  const form = document.getElementById("form-pedido");
  if (form) {
    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        codigo: parseInt(document.getElementById("f-codigo").value, 10),
        sector: parseInt(document.getElementById("f-sector").value, 10),
        prodCod: parseInt(document.getElementById("f-producto").value, 10),
        cantidad: parseInt(document.getElementById("f-cantidad").value, 10),
        prioridad: parseInt(document.getElementById("f-prioridad").value, 10),
      };
      const result = registrarPedido(data);
      const errEl = document.getElementById("form-error");
      if (!result.ok) {
        errEl.innerHTML = `<div class="error-text">⚠ ${result.error}</div>`;
        errEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        showToast(result.error, "danger");
      } else {
        errEl.innerHTML = "";
        showToast(`Pedido #${data.codigo} registrado correctamente.`);
        render();
      }
    });
  }
  const btnPlan = document.getElementById("btn-planificar");
  if (btnPlan) btnPlan.addEventListener("click", () => { planificarRutas(); showToast("Planificación de rutas ejecutada."); render(); });

  const btnDesp = document.getElementById("btn-despachar");
  if (btnDesp) btnDesp.addEventListener("click", () => { realizarEntregas(); showToast("Simulación de despacho ejecutada."); render(); });

  const btnCsv = document.getElementById("btn-exportar-csv");
  if (btnCsv) btnCsv.addEventListener("click", exportarReporteCSV);

  const btnPrint = document.getElementById("btn-imprimir");
  if (btnPrint) btnPrint.addEventListener("click", () => window.print());

  document.querySelectorAll(".btn-cancelar").forEach(btn => {
    btn.addEventListener("click", () => {
      const codigo = parseInt(btn.dataset.codigo, 10);
      if (!confirm(`¿Cancelar el pedido #${codigo}?`)) return;
      const r = cancelarPedido(codigo);
      if (r.ok) { showToast(`Pedido #${codigo} cancelado.`); render(); }
      else showToast(r.error, "danger");
    });
  });

  document.querySelectorAll(".btn-mantenimiento").forEach(btn => {
    btn.addEventListener("click", () => {
      const codigo = btn.dataset.codigo;
      const r = alternarMantenimiento(codigo);
      if (r.ok) { showToast(`Vehículo ${codigo} actualizado.`); render(); }
      else showToast(r.error, "danger");
    });
  });

  const searchInv = document.getElementById("search-inventario");
  if (searchInv) {
    searchInv.addEventListener("input", () => {
      const term = searchInv.value.trim().toLowerCase();
      document.querySelectorAll("#content table tbody tr[data-search]").forEach(tr => {
        tr.style.display = tr.dataset.search.includes(term) ? "" : "none";
      });
    });
  }

  const searchPed = document.getElementById("search-pedidos");
  if (searchPed) {
    searchPed.addEventListener("input", () => {
      const term = searchPed.value.trim().toLowerCase();
      document.querySelectorAll("#content table tbody tr[data-search]").forEach(tr => {
        tr.style.display = tr.dataset.search.includes(term) ? "" : "none";
      });
    });
  }
}

document.getElementById("menu").addEventListener("click", e => {
  const item = e.target.closest(".nav-item");
  if (!item) return;
  currentPage = item.dataset.page;
  if (currentPage === "reporte") generarReporte();
  render();
  closeSidebar();
});

const sidebarEl = document.querySelector(".sidebar");
const overlayEl = document.getElementById("sidebar-overlay");
function openSidebar() { sidebarEl.classList.add("open"); overlayEl.classList.add("show"); }
function closeSidebar() { sidebarEl.classList.remove("open"); overlayEl.classList.remove("show"); }
document.getElementById("btn-hamburger").addEventListener("click", () => {
  sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
});
overlayEl.addEventListener("click", closeSidebar);
window.addEventListener("resize", () => { if (window.innerWidth > 1024) closeSidebar(); });

// reloj
function tickClock() {
  const now = new Date();
  document.getElementById("clock-time").textContent = now.toLocaleTimeString("es-EC", { hour12: false });
  document.getElementById("clock-date").textContent = now.toLocaleDateString("es-EC", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
}
tickClock();
setInterval(tickClock, 1000);

document.getElementById("btn-reiniciar").addEventListener("click", () => {
  if (confirm("¿Reiniciar el sistema? Se perderán todos los pedidos, cambios de inventario y la bitácora actuales, y se restaurarán los datos de fábrica.")) {
    reiniciarSistema();
    render();
    showToast("Sistema reiniciado a los valores de fábrica.");
  }
});

render();

const criticos = state.products.filter(p => p.stock <= p.minimo).length;
if (criticos > 0) {
  setTimeout(() => showToast(`⚠ ${criticos} producto(s) con stock por debajo del mínimo.`, "danger"), 700);
}
</script>
</body>
</html>
